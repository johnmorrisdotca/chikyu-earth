<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chikyu Earth, full screen</title>
    <meta name="description" content="The realistic Earth filling the whole screen, dark, with every satellite group at once: drag anywhere to turn, the wheel to zoom." />
    <style>
      :root { color-scheme: dark; --ink: #eef2fa; --line: rgba(255, 255, 255, 0.22); --panel: rgba(8, 12, 22, 0.66); --accent: #8fb0ff; }
      html, body { margin: 0; height: 100%; background: #04060c; color: var(--ink); font: 14px/1.3 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; overflow: hidden; }
      main { position: fixed; inset: 0; }
      chikyu-earth-realistic { position: absolute; inset: 0; width: 100%; height: 100%; }
      chikyu-earth-realistic:focus-visible { outline: 3px solid #6cd0ff; outline-offset: -3px; }
      .top { position: absolute; inset: 0 0 auto 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; pointer-events: none; }
      .top > * { pointer-events: auto; }
      .top h1 { margin: 0 auto 0 0; font-size: 1rem; font-weight: 600; text-shadow: 0 0 6px #000; pointer-events: none; }
      .top a { color: var(--ink); }
      time { font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); min-height: 20px; }
      .strip { position: absolute; inset-inline: 0; bottom: 56px; display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; padding: 0 8px; pointer-events: none; }
      .strip > * { pointer-events: auto; }
      .group { display: inline-flex; gap: 2px; padding: 2px; border-radius: 26px; background: var(--panel); border: 1px solid var(--line); }
      button.pill { min-width: 48px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 24px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
      button.pill[aria-pressed="true"], button.pill[aria-checked="true"] { background: var(--ink); color: #04060c; }
      button.pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      kazoku-view-controls { position: absolute; inset-inline: 8px auto; bottom: 8px; }
      .status { position: absolute; right: 10px; bottom: 12px; max-width: 40ch; margin: 0; font-size: 12px; text-align: end; text-shadow: 0 0 4px #000; }
      @media (max-width: 640px) {
        .strip { bottom: 64px; }
        .status { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- the element is made by fullscreen.ts -->
      <div class="top">
        <h1><span data-say="title">Chikyu Earth, full screen</span></h1>
        <time id="when" aria-live="off"></time>
        <a href="./" data-say="back">The demo</a>
      </div>
      <div class="strip">
        <div class="group" role="group" aria-label="Clock" data-say-label="clock"><button type="button" class="pill" id="play" aria-pressed="true" data-say="play">Pause</button></div>
        <div class="group" role="radiogroup" aria-label="Camera" data-say-label="camera">
          <button type="button" class="pill" role="radio" data-camera="space" aria-checked="true" data-say="cam_space">In the stars</button>
          <button type="button" class="pill" role="radio" data-camera="sun" aria-checked="false" data-say="cam_sun">Sun side</button>
          <button type="button" class="pill" role="radio" data-camera="ground" aria-checked="false" data-say="cam_ground">Ground</button>
        </div>
        <div class="group" role="group" aria-label="Satellites" data-say-label="sats">
          <button type="button" class="pill" id="sats" aria-pressed="false" data-say="sats_all">All satellites</button>
        </div>
      </div>
      <kazoku-view-controls id="bar" layout="compact" overlay tilt-max="90" zoom-min="0.1" zoom-max="5"></kazoku-view-controls>
      <p class="status" id="status" role="status"></p>
    </main>
    <script type="module" src="fullscreen.js"></script>
  </body>
</html>
