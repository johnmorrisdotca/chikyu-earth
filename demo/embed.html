<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chikyu Earth embed</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #frame { width: min(100vw, 100vh); height: min(100vw, 100vh); touch-action: none; outline-offset: -3px; }
      #frame[data-turn="0"] { touch-action: auto; }
      #frame:focus-visible { outline: 3px solid #6cd0ff; }
      chikyu-earth, chikyu-earth-realistic, chikyu-space { display: block; width: 100%; aspect-ratio: 1; }
      chikyu-earth[hidden], chikyu-earth-realistic[hidden], chikyu-space[hidden] { display: none; }
      chikyu-earth svg { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="frame" data-testid="frame" data-turn="0"></div>
    <script type="module" src="embed.js"></script>
  </body>
</html>
