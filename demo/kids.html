<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1424'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%2313203a' stroke='%238fa1b8' stroke-width='4'/%3E%3Cpath d='M30 38Q44 30 56 40T70 52M34 60Q46 54 58 66' fill='none' stroke='%238fa1b8' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <!--family:header-->
      <!--family:unreviewed-->
      <section class="kids" aria-labelledby="kids-heading">
        <h1 id="kids-heading" class="kids-title" data-say="kd_heading">Sheets to print</h1>
        <p class="fam-fine" data-say="kd_lede"></p>
        <div class="kids-picks">
          <div class="fam-row"><span class="fam-label" data-say="kd_kind">Sheet</span><span class="fam-seg kids-seg" id="kinds" role="group" data-say-label="kd_kind"></span></div>
          <div class="fam-row" id="row-view"><span class="fam-label" data-say="kd_view">Side</span><span class="fam-seg kids-seg" id="views" role="group" data-say-label="kd_view"></span></div>
          <div class="fam-row" id="row-country">
            <label class="field"><span data-say="kd_pick">Country</span><select id="country" class="fam-field"></select></label>
            <button type="button" class="fam-button" id="flag-toggle" aria-pressed="false"></button>
            <img id="flag" class="kids-flag" alt="" hidden />
            <span class="fam-fine" id="flag-note" role="status"></span>
          </div>
          <div class="fam-row" id="row-when">
            <label class="field"><span data-say="kd_date">Date</span><input id="date" class="fam-field" type="date" /></label>
            <label class="field"><span data-say="kd_time">Time (UTC)</span><input id="time" class="fam-field" type="time" step="900" /></label>
            <span class="fam-seg kids-seg" id="whens" role="group" data-say-label="kd_when"></span>
          </div>
          <div class="fam-row"><span class="fam-label" data-say="kd_paper">Paper</span><span class="fam-seg" id="papers" role="group" data-say-label="kd_paper"></span><span class="fam-label" data-say="kd_type">Type</span><span class="fam-seg" id="types" role="group" data-say-label="kd_type"></span>
            <button type="button" class="fam-button" id="print" data-primary="true"></button></div>
        </div>
        <p class="fam-fine" id="info" role="status"></p>
        <p class="fam-fine"><span data-say="kd_pdfs">Ready-made PDFs:</span> <a id="pdfs" href="pdf/" data-say="kd_pdflink">PDF list</a></p>
        <div id="paper" class="kids-paper" role="group" data-say-label="kd_preview"><div id="paper-inner"></div></div>
      </section>
      <!--family:footer-->
    </main>
    <!--family:scripts kids.js-->
  </body>
</html>
