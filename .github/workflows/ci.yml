name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 -m venv .cache/venv && .cache/venv/bin/pip install pillow
      - name: The Earth tile script on a tiny made-up map (counts, sizes, seams, the antimeridian)
        run: .cache/venv/bin/python -I scripts/make-earth-tiles.py selftest
      - name: The finer-ground coverage script on a tiny made-up map (the package's reading of a pixel, the words, the summary)
        run: .cache/venv/bin/python -I scripts/finer-coverage.py selftest
      - run: pnpm check
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports
        run: pnpm test:package
  demo:
    # The browser suite was one job of 21 minutes, then slices of it each reached 25 (MODULES-1528): the realistic Earth's WebGL tests are now six parts (--shard), the update-cost check one job of its own (one worker, nothing beside it), the graphics-memory file (freeze, 15 minutes in one job) four parts of the Chromium desk, every other file in Chromium desk and phone one job, then WebKit. Each part may take 25 minutes. Every test still runs once.
    name: demo (${{ matrix.name }})
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "realistic Earth 1 of 6", browser: chromium, projects: "--project=chromium-gl --shard=1/6" }
          - { name: "realistic Earth 2 of 6", browser: chromium, projects: "--project=chromium-gl --shard=2/6" }
          - { name: "realistic Earth 3 of 6", browser: chromium, projects: "--project=chromium-gl --shard=3/6" }
          - { name: "realistic Earth 4 of 6", browser: chromium, projects: "--project=chromium-gl --shard=4/6" }
          - { name: "realistic Earth 5 of 6", browser: chromium, projects: "--project=chromium-gl --shard=5/6" }
          - { name: "realistic Earth 6 of 6", browser: chromium, projects: "--project=chromium-gl --shard=6/6" }
          - { name: "update cost, Chromium, alone", browser: chromium, projects: "--project=chromium-cost --workers=1" }
          - { name: "graphics memory, Chromium desk 1 of 4", browser: chromium, set: freeze, projects: "--project=chromium-desk --shard=1/4" }
          - { name: "graphics memory, Chromium desk 2 of 4", browser: chromium, set: freeze, projects: "--project=chromium-desk --shard=2/4" }
          - { name: "graphics memory, Chromium desk 3 of 4", browser: chromium, set: freeze, projects: "--project=chromium-desk --shard=3/4" }
          - { name: "graphics memory, Chromium desk 4 of 4", browser: chromium, set: freeze, projects: "--project=chromium-desk --shard=4/4" }
          - { name: "desk and phone, Chromium", browser: chromium, set: rest, projects: "--project=chromium-desk --project=chromium-phone" }
          - { name: "desk and phone, WebKit", browser: webkit, projects: "--project=webkit-desk --project=webkit-phone" }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.browser }}
      - name: The demo, played in ${{ matrix.name }}
        run: pnpm test:demo:one ${{ matrix.projects }}
        env:
          DEMO_SET: ${{ matrix.set }}
  usage:
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Every way to use it (a script tag, Vite, webpack, React, Vue, Svelte, Angular, an iframe, TypeScript, Node), from the package as npm packs it
        run: pnpm test:usage
      - name: The realistic Earth's soak, one minute (ten minutes by hand with pnpm test:soak)
        run: SOAK_MINUTES=1 pnpm test:soak
  commits:
    # A pushed commit message never names an AI as author or co-author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="HEAD~1..HEAD"
          if git log --format='%an %ae%n%cn %ce%n%B' "$range" | grep -i -E 'co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt)|noreply@anthropic|noreply@openai'; then
            echo "A commit names an AI as author (see AGENTS.md: no AI attribution)"; exit 1
          fi
