name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 -m venv .cache/venv && .cache/venv/bin/pip install pillow
      - name: The Earth tile script on a tiny made-up map (counts, sizes, seams, the antimeridian)
        run: .cache/venv/bin/python -I scripts/make-earth-tiles.py selftest
      - run: pnpm check
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports
        run: pnpm test:package
  demo:
    # The browser suite was one job of 21 minutes. Now one job a slice: the realistic Earth's WebGL tests in three parts (--shard), then the other projects in Chromium in two parts (one job reached its 15 minutes on 2026-11-09), then in WebKit. Each part may take 25 minutes. Every test still runs once.
    name: demo (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "realistic Earth 1 of 3", browser: chromium, projects: "--project=chromium-gl --shard=1/3" }
          - { name: "realistic Earth 2 of 3", browser: chromium, projects: "--project=chromium-gl --shard=2/3" }
          - { name: "realistic Earth 3 of 3", browser: chromium, projects: "--project=chromium-gl --shard=3/3" }
          - { name: "desk and phone, Chromium 1 of 2", browser: chromium, projects: "--project=chromium-desk --project=chromium-phone --shard=1/2" }
          - { name: "desk and phone, Chromium 2 of 2", browser: chromium, projects: "--project=chromium-desk --project=chromium-phone --shard=2/2" }
          - { name: "desk and phone, WebKit", browser: webkit, projects: "--project=webkit-desk --project=webkit-phone" }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: The demo, played in ${{ matrix.name }}
        run: pnpm test:demo:one ${{ matrix.projects }}
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Every way to use it (a script tag, Vite, webpack, React, Vue, Svelte, Angular, an iframe, TypeScript, Node), from the package as npm packs it
        run: pnpm test:usage
      - name: The realistic Earth's soak, one minute (ten minutes by hand with pnpm test:soak)
        run: SOAK_MINUTES=1 pnpm test:soak
  commits:
    # A pushed commit message never names an AI as author or co-author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="HEAD~1..HEAD"
          if git log --format='%an %ae%n%cn %ce%n%B' "$range" | grep -i -E 'co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt)|noreply@anthropic|noreply@openai'; then
            echo "A commit names an AI as author (see AGENTS.md: no AI attribution)"; exit 1
          fi
