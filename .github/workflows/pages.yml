# Publishes the demo to GitHub Pages on every push to main, and every six hours with fresh satellite elements. Nothing here costs
# anything on a public repository.
# The satellites: a push carries over the element files already on the live site (it asks CelesTrak for nothing). The scheduled run (and a manual run with "refresh" ticked)
# downloads each CelesTrak list once, a pause between lists, and stops at the first answer that is not 200 (CelesTrak's usage policy, read 2026-11-03: a list is
# downloaded once per update, and an update comes every two hours). A list is not asked for again within 110 minutes. No server runs per view: the visitor's browser reads files on Pages.
# A group CelesTrak has left more than 12 hours old is asked of Space-Track instead (its GP class, once a day for each group), when the secrets SPACETRACK_USER and SPACETRACK_PASSWORD are set;
# without them the step says "CelesTrak only" and the groups keep their last files. The login is only ever passed in the environment of that one step.
# The Earth-orbit catalogue (demo/catalogue, made by scripts/catalogue.ts): every run carries over the files already on the site, so a push never drops them. Only a call with `catalogue: true` (the Catalogue
# workflow, once a day) asks Space-Track for new ones, and only when the repository variable CATALOGUE_PUBLISH is `yes`; that call skips the six-hourly satellite refresh above (a called workflow still sees the
# caller's schedule event, and it would ask Space-Track twice) and runs `pnpm check` like a push. Every step has a timeout, nothing is retried, and nothing here costs anything on a public repository.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Download new satellite elements from CelesTrak (a list is not asked for again within 110 minutes)
        type: boolean
        default: false
  workflow_call:
    inputs:
      refresh:
        type: boolean
        default: false
      catalogue:
        description: Download the whole Earth-orbit catalogue from Space-Track (the Catalogue workflow sets this once a day)
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    # The Earth tiles above day 4 and night 3 are published only when the repository variable EARTH_TILES_ALL is yes (scripts/site.ts, docs/guides/earth-tiles.md).
    env:
      EARTH_TILES_ALL: ${{ vars.EARTH_TILES_ALL }}
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Satellites, the files already on the site
        timeout-minutes: 5
        run: node scripts/elements.ts previous https://johnmorrisdotca.github.io/chikyu-earth/elements
      - name: Satellites, new elements from CelesTrak, Space-Track when it does not answer (every six hours)
        timeout-minutes: 15
        if: (github.event_name == 'schedule' || inputs.refresh) && !inputs.catalogue
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: node scripts/elements.ts fetch
      - name: Satellites, the files are fit to publish
        timeout-minutes: 5
        run: node scripts/elements.ts check demo/elements
      - name: Catalogue, the files already on the site
        timeout-minutes: 5
        run: node scripts/catalogue.ts previous https://johnmorrisdotca.github.io/chikyu-earth/catalogue
      - name: Catalogue, new files from Space-Track (once a day, only for the Catalogue workflow, only once CATALOGUE_PUBLISH is yes)
        timeout-minutes: 15
        if: inputs.catalogue && vars.CATALOGUE_PUBLISH == 'yes'
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
          CATALOGUE_WORKING_LIST: ${{ vars.CATALOGUE_WORKING_LIST }}
        run: node scripts/catalogue.ts fetch
      - name: Catalogue, the files are fit to publish
        timeout-minutes: 5
        run: node scripts/catalogue.ts check demo/catalogue --optional
      - run: pnpm check
        timeout-minutes: 20
        if: github.event_name != 'schedule' || inputs.catalogue
      - name: The Earth tiles, cut from NASA's big maps (kept between runs while the script and its sources are the same); pnpm site copies them to site/tiles
        timeout-minutes: 10
        uses: actions/cache@v6
        id: tiles
        with:
          path: .cache/earth-tiles-out
          key: earth-tiles-${{ vars.EARTH_TILES_ALL == 'yes' && 'all' || 'base' }}-${{ hashFiles('scripts/make-earth-tiles.py', 'scripts/earth-tiles-sources.json') }}
      - name: NASA's source maps for the finest levels, 688 MB (only with EARTH_TILES_ALL; kept while the list of sources is the same, so a change to the cutting script downloads nothing)
        if: steps.tiles.outputs.cache-hit != 'true' && vars.EARTH_TILES_ALL == 'yes'
        timeout-minutes: 10
        uses: actions/cache@v6
        with:
          path: .cache/earth-tiles
          key: earth-tiles-sources-${{ hashFiles('scripts/earth-tiles-sources.json') }}
      - if: steps.tiles.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: python3 -m venv .cache/venv && .cache/venv/bin/pip install pillow && .cache/venv/bin/python -I scripts/make-earth-tiles.py build
      - run: pnpm site
        timeout-minutes: 10
      - run: pnpm docs:site
        timeout-minutes: 15
      - uses: ./.github/actions/playwright
        timeout-minutes: 10
        with:
          browsers: chromium
      - name: The ready-made PDFs of the printable sheets
        timeout-minutes: 15
        run: node scripts/make-pdfs.mjs
      - uses: actions/configure-pages@v6
        timeout-minutes: 5
      - uses: actions/upload-pages-artifact@v5
        timeout-minutes: 10
        with:
          path: site
      - id: deployment
        timeout-minutes: 10
        uses: actions/deploy-pages@v5
