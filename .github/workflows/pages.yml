# Publishes the demo to GitHub Pages on every push to main, and every six hours with fresh satellite elements. Nothing here costs
# anything on a public repository.
# The satellites: a push carries over the element files already on the live site (it asks CelesTrak for nothing). The scheduled run (and a manual run with "refresh" ticked)
# downloads each CelesTrak list once, a pause between lists, and stops at the first answer that is not 200 (CelesTrak's usage policy, read 2026-11-03: a list is
# downloaded once per update, and an update comes every two hours). A list is not asked for again within 110 minutes. No server runs per view: the visitor's browser reads files on Pages.
# A group CelesTrak has left more than 12 hours old is asked of Space-Track instead (its GP class, once a day for each group), when the secrets SPACETRACK_USER and SPACETRACK_PASSWORD are set;
# without them the step says "CelesTrak only" and the groups keep their last files. The login is only ever passed in the environment of that one step.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Download new satellite elements from CelesTrak (a list is not asked for again within 110 minutes)
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Satellites, the files already on the site
        run: node scripts/elements.ts previous https://johnmorrisdotca.github.io/chikyu-earth/elements
      - name: Satellites, new elements from CelesTrak, Space-Track when it does not answer (every six hours)
        if: github.event_name == 'schedule' || inputs.refresh
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: node scripts/elements.ts fetch
      - name: Satellites, the files are fit to publish
        run: node scripts/elements.ts check demo/elements
      - run: pnpm check
        if: github.event_name != 'schedule'
      - name: The Earth tiles, cut from NASA's big maps (kept between runs while the script is the same); pnpm site copies them to site/tiles
        uses: actions/cache@v6
        id: tiles
        with:
          path: .cache/earth-tiles-out
          key: earth-tiles-${{ hashFiles('scripts/make-earth-tiles.py') }}
      - if: steps.tiles.outputs.cache-hit != 'true'
        run: python3 -m venv .cache/venv && .cache/venv/bin/pip install pillow && .cache/venv/bin/python -I scripts/make-earth-tiles.py build
      - run: pnpm site
      - run: pnpm docs:site
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: The ready-made PDFs of the printable sheets
        run: node scripts/make-pdfs.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
