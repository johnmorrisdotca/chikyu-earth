name: Release
# Run by hand (Actions → Release → Run workflow) from main, or push a v<version> tag. The steps are the family's shared
# release in kazoku-ui; npm trusts THIS file by name (npmjs.com → the package → Settings → Trusted Publisher).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    uses: johnmorrisdotca/kazoku-ui/.github/workflows/reusable-release.yml@v0.43.0
    with:
      check-command: pnpm check && pnpm test:package
      freeze-command: pnpm test:freeze
      require-ci-workflow: ci.yml
      github-release: true
